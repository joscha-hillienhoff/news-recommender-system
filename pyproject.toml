[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-recommender-system"
version = "0.1.0"
description = "Benchmark of popularity, content-based, BPR and hybrid news recommenders on MIND-small, including CO2 cost."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Joscha Hillienhoff", email = "116641415+joscha-hillienhoff@users.noreply.github.com" },
]
requires-python = ">=3.10,<3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "codecarbon>=3.0",
  "numpy",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
content = ["nltk>=3.8", "sentence-transformers>=3"]
bpr = ["cornac>=2"]
hybrid = ["lightgbm>=4", "tensorflow>=2.16"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["news_recommender_system*"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["news_recommender_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
